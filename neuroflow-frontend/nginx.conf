# Serves the built SPA with client-side routing fallback. Reverse-proxying
# /api and /webhook to the backend is handled by the host's own nginx (not
# this container) -- see docs/18-deployment-and-operations.md #18.1. This
# config only needs to know about its own static files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # config.js is regenerated per-container-start; never cache it.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Hashed asset filenames are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
