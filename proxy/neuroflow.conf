# Reference nginx site config for the HOST's own nginx -- not a container.
# Install at /etc/nginx/sites-available/neuroflow.conf, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# Assumes `web` and `api` are published to 127.0.0.1 per docker-compose.yml
# (WEB_PORT default 3000, API_PORT default 8000). Replace
# neuroflow.example.com with your real domain, or run `certbot --nginx` for
# it after this is live to add TLS -- see
# docs/18-deployment-and-operations.md #18.1.
#
# /webhook/* and /webhook-test/* live outside /api/v1 deliberately
# (docs/11-api-design.md #11.12): third-party services register these URLs
# permanently and they must survive an API version bump untouched.

server {
    listen 80;
    server_name neuroflow.example.com;

    client_max_body_size 32m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook-test/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE execution streams (docs/03-system-architecture.md #3.6) must not
    # be buffered -- buffering turns a live stream into one delivered in
    # chunks after the fact, and a long-lived connection can otherwise be
    # cut at nginx's default proxy_read_timeout.
    location /api/v1/executions/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
