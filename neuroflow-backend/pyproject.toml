[project]
name = "neuroflow-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "PT", "SIM", "RET", "ARG", "PTH"]
ignore = [
    "S101",   # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ARG001"]
"alembic/*" = ["N999"]
# app/core/types.py: the name matches stdlib `types`, but it is never
# imported except as app.core.types -- no real shadowing risk, and the
# design doc (docs/08-backend-architecture.md #8.6) names it explicitly.
"app/core/types.py" = ["A005"]
"app/core/logging.py" = ["A005"]
# The node's descriptor name is "Code" (docs/13-node-catalog-and-sdk.md
# #13.5); it is never imported except as app.nodes.code, so there is no
# real shadowing risk with stdlib `code`.
"app/nodes/code.py" = ["A005"]
# FastAPI's lifespan contract requires the `app` parameter even when unused.
"app/main.py" = ["ARG001"]
# arq's on_startup/on_shutdown callback contract requires `ctx` even when unused.
"app/worker.py" = ["ARG001"]
# NullObjectStorage's params exist to satisfy the ObjectStorage protocol,
# not to be used -- see docs/10-database-schema.md #10.6.
"app/core/object_storage.py" = ["ARG002"]
# The module name shadows stdlib `queue`, but it is never imported except
# as app.core.queue -- no real shadowing risk, same reasoning as
# app/core/types.py above.
"app/core/queue.py" = ["A005"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["arq.*", "testcontainers.*", "factory.*", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session: app.core.database's `engine` is a
# module-level singleton (built once at import time), and an async
# connection pool bound to one event loop cannot be reused from another --
# per-function loops (pytest-asyncio's default) silently hang rather than
# erroring against it. See docs/17-testing-strategy.md #17.4.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/nodes/*", "*/tests/*"]

# Architectural boundaries enforced mechanically, not just by review -- see
# docs/03-system-architecture.md #3.9 and docs/17-testing-strategy.md #17.7.
# Only the two contracts checkable against what exists today are wired up;
# module-level contracts (services must not import fastapi, one module's
# repository must not import another's) are added as each module lands in
# Phase 2+, once app/modules/*/service.py and .../repository.py exist to
# check -- a contract naming a module that doesn't exist yet fails to build
# rather than passing vacuously.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "API layer must not import the execution engine or node implementations"
type = "forbidden"
source_modules = ["app.api", "app.main"]
forbidden_modules = [
    "app.engine",
    "app.nodes",
    # The two "most dangerous method in the codebase" decryption paths
    # (docs/09-domain-modules.md #9.6/#9.13) -- reachable only from the
    # engine, never a router. The rest of app.modules.credentials/
    # app.modules.variables stays router-reachable.
    "app.modules.credentials.decryption",
    "app.modules.variables.decryption",
]

[[tool.importlinter.contracts]]
name = "core/ is a leaf: it must not import the API, domain modules, or the engine"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.api", "app.modules", "app.engine", "app.nodes"]
